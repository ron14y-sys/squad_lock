name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each gate runs even if an earlier one failed, so a pull request gets
      # the full picture in one go instead of one error at a time.
      - name: Check formatting
        if: "!cancelled()"
        run: npm run format:check

      - name: Lint
        if: "!cancelled()"
        run: npm run lint

      - name: Typecheck
        if: "!cancelled()"
        run: npm run typecheck

      - name: Test
        if: "!cancelled()"
        run: npm run test

      - name: Build
        if: "!cancelled()"
        run: npm run build
